<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#141414"/>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-6" dy="0" stdDeviation="8" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>
  <g>
    <!-- Left stem -->
    <rect x="136" y="88" width="80" height="336" fill="#B81D24"/>
    <!-- Right stem -->
    <rect x="296" y="88" width="80" height="336" fill="#B81D24"/>
    <!-- Center diagonal ribbon -->
    <polygon points="136,88 216,88 376,424 296,424" fill="#E50914" filter="url(#shadow)"/>
  </g>
</svg>
